# Cuando subes o editas un .md en contenido/, este workflow regenera
# contenido/indice.json solo y lo commitea. Tú no tocas nada.
name: Regenerar índice

on:
  push:
    branches: [main]
    paths:
      - 'contenido/**/*.md'
      - 'scripts/generar-indice.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar índice
        run: node scripts/generar-indice.mjs

      - name: Commitear si cambió
        run: |
          if [[ -n "$(git status --porcelain contenido/indice.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contenido/indice.json
            git commit -m "chore: regenerar índice de contenido"
            git push
          else
            echo "El índice ya estaba al día."
          fi
